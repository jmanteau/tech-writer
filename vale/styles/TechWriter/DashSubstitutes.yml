# H5: characters that stand in for a dash: middle dots as separators and a spaced hyphen
# between words. A minus sign ("5 - 3") is not a dash, so read the spaced-hyphen alerts.
extends: existence
message: "Replace the dash substitute '%s' with a comma, colon, period, or parentheses (H5)."
level: warning
nonword: true
tokens:
  - '[·・‧∙]'
  - '\S •'
  - '[A-Za-z] - [A-Za-z]'
